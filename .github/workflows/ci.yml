name: CI

on:
  push:
    branches: [fix/video-fidelity]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm run build` lance aussi le typecheck.
      - run: npm run build
